
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Refugio de Gounter | EVARKION</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/karu-chat.css">

    <script src="js/game.js" defer></script>
    <script src="js/karu-chat.js" defer></script>
</head>

<body>

    <main class="refuge-container">

        <section class="room-frame">

            <div class="room" id="room">

                <!-- HABITACIÓN -->
                <div class="room-background"></div>
                <div class="room-overlay"></div>

                <div class="room-light"></div>
                <div class="room-floor-light"></div>
                <div class="window-rays"></div>
                <!-- CABECERA -->
                <header class="room-header">

                    <div class="header-brand">
                        <span class="brand-icon">✦</span>

                        <div>
                            <h1>REFUGIO DE GOUNTER</h1>
                            <p>EVARKION · UN PEQUEÑO MUNDO</p>
                        </div>
                    </div>

                    <div class="room-status">
                        <span class="status-dot"></span>
                        <span>Gounter está en casa</span>
                    </div>

                </header>

                <!-- OBJETOS -->
                <div class="objects-container">

                    <div class="room-object food-object"
                         data-action="food"
                         draggable="false">

                        <img src="assets/objects/comida.png"
                             alt="Comida de Gounter"
                             draggable="false">

                        <span>COMIDA</span>
                    </div>

                    <div class="room-object water-object"
                         data-action="water"
                         draggable="false">

                        <img src="assets/objects/agua.png"
                             alt="Agua de Gounter"
                             draggable="false">

                        <span>AGUA</span>
                    </div>

                    <div class="room-object sack-object"
                         data-action="sack"
                         draggable="false">

                        <img src="assets/objects/saco.png"
                             alt="Saco de Gounter"
                             draggable="false">

                        <span>SACO</span>
                    </div>

                    <div class="room-object box-object"
                         data-action="box"
                         draggable="false">

                        <img src="assets/objects/caja.png"
                             alt="Caja de Gounter"
                             draggable="false">

                        <span>CAJA</span>
                    </div>

                </div>

                <!-- GOUNTER -->
                <div class="cat-area" id="cat-area">

                    <div class="cat-shadow"></div>

                    <img
                        src="assets/characters/gunter_idle.png"
                        id="gounter"
                        class="gounter"
                        alt="Gounter"
                        draggable="false"
                    >

                    <div class="cat-name">
                        GOUNTER <span>♥</span>
                    </div>

                </div>

                <!-- MENSAJE -->
                <div class="room-message" id="room-message">
                    Gounter está descansando. 🐾
                </div>

                <!-- CHAT ÚNICO DE KARU -->
                <aside class="karu-chat" id="karu-chat">

                    <div class="karu-header">

                        <img
                            src="assets/characters/karu_avatar.png"
                            class="karu-avatar"
                            alt="Karu"
                        >

                        <div class="karu-info">
                            <strong>Karu</strong>
                            <span>Asistente del refugio</span>
                        </div>

                        <button
                            class="karu-minimize"
                            id="karu-minimize"
                            type="button"
                            aria-label="Minimizar chat"
                        >−</button>

                    </div>

                    <div class="karu-chat-content"
                         id="karu-chat-content">

                        <div class="karu-messages"
                             id="karu-messages">

                            <div class="message karu-message">
                                ¡Hola! Soy Karu. 🐱

                                Gounter está esperándote.
                                Puedes darle comida, agua o jugar con él.
                            </div>

                        </div>

                        <div class="karu-options">

                            <button data-message="¿Cómo está Gounter?">
                                ¿Cómo está Gounter?
                            </button>

                            <button data-message="Quiero darle de comer">
                                Darle de comer
                            </button>

                            <button data-message="Quiero jugar con Gounter">
                                Jugar
                            </button>

                        </div>

                        <form class="karu-input-area"
                              id="karu-form">

                            <input
                                type="text"
                                id="karu-input"
                                placeholder="Habla con Karu..."
                                maxlength="250"
                                autocomplete="off"
                            >

                            <button type="submit"
                                    aria-label="Enviar">➤</button>

                        </form>

                    </div>

                </aside>

            </div>

        </section>

    </main>

</body>
</html>
