
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Refugio de Gounter | EVARKION</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/karu-chat.css">

    <script src="js/game.js" defer></script>
    <script src="js/karu-chat.js" defer></script>
</head>

<body>

    <main class="refuge-container">

        <!-- Marco animado de la habitación -->
        <section class="room-frame">

            <div class="room" id="room">

                <!-- Fondo -->
                <div class="room-background"></div>

                <!-- Capa decorativa -->
                <div class="room-overlay"></div>

                <!-- Cabecera -->
                <header class="room-header">

                    <div class="header-brand">
                        <span class="brand-icon">✦</span>

                        <div>
                            <h1>REFUGIO DE GOUNTER</h1>
                            <p>EVARKION · UN PEQUEÑO MUNDO</p>
                        </div>
                    </div>

                    <div class="room-status">
                        <span class="status-dot"></span>
                        <span>Gounter está en casa</span>
                    </div>

                </header>

                <!-- Zona de juego -->
                <div class="room-content">

                    <!-- Objetos interactivos -->
                    <div class="objects-container">

                        <button class="room-object"
                                id="food-object"
                                data-action="food"
                                aria-label="Comida de Gounter"
                                draggable="false">

                            <img src="assets/objects/comida.png"
                                 alt="Comida">

                            <span>COMIDA</span>
                        </button>

                        <button class="room-object"
                                id="water-object"
                                data-action="water"
                                aria-label="Agua de Gounter"
                                draggable="false">

                            <img src="assets/objects/agua.png"
                                 alt="Agua">

                            <span>AGUA</span>
                        </button>

                        <button class="room-object"
                                id="sack-object"
                                data-action="sack"
                                aria-label="Saco de Gounter"
                                draggable="false">

                            <img src="assets/objects/saco.png"
                                 alt="Saco">

                            <span>SACO</span>
                        </button>

                        <button class="room-object"
                                id="box-object"
                                data-action="box"
                                aria-label="Caja de Gounter"
                                draggable="false">

                            <img src="assets/objects/caja.png"
                                 alt="Caja">

                            <span>CAJA</span>
                        </button>

                    </div>

                    <!-- Gounter -->
                    <div class="cat-area">

                        <div class="cat-shadow"></div>

                        <img
                            src="assets/characters/gunter_idle.png"
                            alt="Gounter, el gato de EVARKION"
                            id="gounter"
                            class="gounter"
                            draggable="false"
                            title="Pulsa para acariciar a Gounter"
                        >

                        <div class="cat-name">
                            <span>GOUNTER</span>
                            <span class="cat-heart">♥</span>
                        </div>

                    </div>

                    <!-- Mensajes del refugio -->
                    <div class="room-message" id="room-message">
                        ¡Bienvenido al refugio!
                    </div>

                </div>

                <!-- Chat de Karu -->
                <aside class="karu-chat" id="karu-chat">

                    <div class="karu-header">

                        <img
                            src="assets/characters/karu_avatar.png"
                            alt="Karu"
                            class="karu-avatar"
                        >

                        <div class="karu-info">
                            <strong>Karu</strong>
                            <span>Asistente del refugio</span>
                        </div>

                        <button
                            class="karu-minimize"
                            id="karu-minimize"
                            aria-label="Minimizar chat"
                        >−</button>

                    </div>

                    <div class="karu-chat-content" id="karu-chat-content">

                        <div class="karu-messages" id="karu-messages">

                            <div class="message karu-message">
                                ¡Hola! Soy Karu. 🐾

                                Gounter está esperándote.
                                Puedes darle comida, agua o jugar con él.
                            </div>

                        </div>

                        <div class="karu-options" id="karu-options">

                            <button data-message="¿Cómo está Gounter?">
                                ¿Cómo está Gounter?
                            </button>

                            <button data-message="Quiero darle de comer">
                                Darle de comer
                            </button>

                            <button data-message="Quiero jugar con Gounter">
                                Jugar
                            </button>

                        </div>

                        <form class="karu-input-area" id="karu-form">

                            <input
                                type="text"
                                id="karu-input"
                                placeholder="Habla con Karu..."
                                autocomplete="off"
                                maxlength="250"
                            >

                            <button type="submit" aria-label="Enviar mensaje">
                                ➤
                            </button>

                        </form>

                    </div>

                </aside>

            </div>

        </section>

        <!-- Pie de página -->
        <footer class="refuge-footer">
            <span>EVARKION</span>
            <span>Un lugar para descansar y compartir aventuras.</span>
        </footer>

    </main>

</body>
</html>
