
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Refugio de Gunter | EVARKION</title>

    <!-- ESTILOS -->
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/karu-chat.css">

    <!-- JAVASCRIPT -->
    <script src="./js/game.js" defer></script>
    <script src="./js/karu-chat.js" defer></script>
</head>

<body>

    <main class="game-container">

        <!-- ESCENARIO -->
        <section class="room-frame">

            <div class="room" id="room">

                <!-- FONDO -->
                <div class="room-background"></div>

                <!-- OSCURIDAD -->
                <div class="room-overlay"></div>

                <!-- CABECERA -->
                <header class="game-header">

                    <div class="brand">

                        <div class="brand-icon">✦</div>

                        <div>
                            <h1>REFUGIO DE GUNTER</h1>
                            <p>EVARKION · Un pequeño mundo para un gran compañero</p>
                        </div>

                    </div>

                    <div class="header-status">
                        <span class="online-dot"></span>
                        Hogar activo
                    </div>

                </header>

                <!-- ESTADO DE GUNTER -->
                <div id="status-indicator">

                    <span class="status-light"></span>

                    <span id="status-text">
                        Gunter está descansando
                    </span>

                </div>

                <!-- COMIDA -->
                <div class="game-object object-food"
                     data-object="food-bowl"
                     data-action="feed">

                    <img src="./assets/objects/comida.png"
                         alt="Cuenco de comida"
                         draggable="false">

                    <span class="object-label">Comida</span>

                </div>

                <!-- AGUA -->
                <div class="game-object object-water"
                     data-object="water-bowl"
                     data-action="drink">

                    <img src="./assets/objects/agua.png"
                         alt="Cuenco de agua"
                         draggable="false">

                    <span class="object-label">Agua</span>

                </div>

                <!-- SACO DE PIENSO -->
                <div class="game-object object-bag"
                     data-object="food-bag"
                     data-action="food">

                    <img src="./assets/objects/saco.png"
                         alt="Saco de pienso"
                         draggable="false">

                    <span class="object-label">Pienso</span>

                </div>

                <!-- CAJA -->
                <div class="game-object object-box"
                     data-object="cardboard-box"
                     data-action="play">

                    <img src="./assets/objects/caja.png"
                         alt="Caja de cartón"
                         draggable="false">

                    <span class="object-label">Caja</span>

                </div>

                <!-- GUNTER -->
                <div class="gunter-character" id="gunter">

                    <div class="character-shadow"></div>

                    <img src="./assets/characters/gunter_idle.png"
                         alt="Gunter"
                         draggable="false">

                </div>

                <!-- MENSAJE DEL JUEGO -->
                <div class="action-message" id="action-message">
                    ¡Bienvenido al refugio!
                </div>

                <!-- VIÑETA -->
                <div class="room-vignette"></div>

            </div>

        </section>

        <!-- AVATAR ORIGINAL DE KARU -->
        <button class="karu-launcher"
                id="karu-toggle"
                type="button"
                aria-label="Abrir chat con Karu"
                aria-expanded="false">

            <span class="karu-launcher-glow"></span>

            <img id="karu-avatar"
                 src="./assets/characters/karu_avatar.png"
                 alt="Karu"
                 draggable="false">

            <span class="karu-online"></span>

            <span class="karu-launcher-label">Karu</span>

        </button>

        <!-- VENTANA DEL CHAT -->
        <section class="karu-chat"
                 id="karu-chat"
                 aria-label="Chat con Karu"
                 aria-hidden="true"
                 hidden>

            <!-- CABECERA DEL CHAT -->
            <div class="chat-header">

                <div class="chat-character">

                    <div class="chat-avatar">

                        <img src="./assets/characters/karu_avatar.png"
                             alt="Karu">

                    </div>

                    <div>
                        <h2>Karu</h2>

                        <span>
                            <span class="chat-online-dot"></span>
                            Disponible en el refugio
                        </span>
                    </div>

                </div>

                <button class="chat-close"
                        id="karu-close"
                        type="button"
                        aria-label="Cerrar chat">
                    ×
                </button>

            </div>

            <!-- MENSAJES -->
            <div class="chat-messages" id="chat-messages">

                <div class="chat-message karu-message">

                    <span class="message-author">Karu</span>

                    ¡Hola! ¿Qué tal? Estoy aquí para acompañarte.

                </div>

            </div>

            <!-- OPCIONES DE CONVERSACIÓN -->
            <div class="chat-options" id="chat-options"></div>

        </section>

    </main>

</body>
</html>
