<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#080808">
    <meta name="description" content="Gunter's World, el pequeño mundo interactivo de Gunter.">

    <title>Gunter's World | EVARKION</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main id="game">

        <!-- ESCENARIO PRINCIPAL -->
        <section id="room" aria-label="Habitación interactiva de Gunter">

            <!-- Título decorativo -->
            <div id="game-sign">
                <span class="sign-small">EVARKION PRESENTA</span>
                <h1>GUNTER'S WORLD</h1>
            </div>

            <!-- PERSONAJE -->
            <img
                id="gunter"
                src="assets/characters/gunter_idle.png"
                alt="Gunter"
                draggable="false"
            >

            <!-- OBJETOS INTERACTIVOS -->
            <button
                class="game-object food-bowl"
                data-object="comida"
                data-action="comer"
                aria-label="Comedero de comida"
                title="Comedero de comida"
            >
                🥣
            </button>

            <button
                class="game-object water-bowl"
                data-object="agua"
                data-action="beber"
                aria-label="Comedero de agua"
                title="Comedero de agua"
            >
                💧
            </button>

            <button
                class="game-object food-bag"
                data-object="saco"
                data-action="inspeccionar"
                aria-label="Saco de pienso"
                title="Saco de pienso"
            >
                👜
            </button>

            <button
                class="game-object cardboard-box"
                data-object="caja"
                data-action="sentarse"
                aria-label="Caja de Gunter"
                title="Caja pequeña"
            >
                📦
            </button>

            <!-- MENSAJE DE ACCIÓN -->
            <div id="action-message" role="status" aria-live="polite">
                Gunter está descansando.
            </div>

            <!-- PANEL DE KARU -->
            <aside id="karu-panel">

                <div class="karu-heading">
                    <img
                        src="assets/characters/karu_avatar.png"
                        alt="Karu"
                        id="karu-avatar"
                    >

                    <div>
                        <h2>Karu</h2>
                        <span>Asistente de Gunter</span>
                    </div>
                </div>

                <p id="karu-text">
                    ¡Hola! Selecciona un objeto para ver qué hace Gunter.
                </p>

            </aside>

            <!-- INDICADOR DE ESTADO -->
            <div id="status-indicator">
                <span class="status-light"></span>
                <span id="status-text">Gunter está tranquilo</span>
            </div>

        </section>

    </main>

    <script src="js/game.js"></script>

</body>
</html>
