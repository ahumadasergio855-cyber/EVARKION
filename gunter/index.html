<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gunter's World | EVARKION</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>

    <h1>🐈 Gunter's World</h1>

    <p>
        Cuida de Gunter, juega con él y descubre curiosidades junto a Karu.
    </p>

</header>

<main>

    <section id="room">

        <!-- Gunter -->

        <img
            id="gunter"
            src="assets/characters/gunter_idle.png"
            alt="Gunter">

        <!-- Caja -->

        <div class="objeto caja">
            📦
        </div>

        <!-- Ovillo -->

        <div class="objeto ovillo">
            🧶
        </div>

        <!-- Comida -->

        <div class="objeto comida">
            🥣
        </div>

        <!-- Agua -->

        <div class="objeto agua">
            💧
        </div>

        <!-- Saco -->

        <div class="objeto saco">
            👜
        </div>

    </section>

    <aside id="karu-panel">

        <div class="karu-top">

            <img
                src="assets/characters/karu_avatar.png"
                alt="Karu"
                id="karu-avatar">

            <h2>Karu</h2>

        </div>

        <div id="karu-text">

            ¡Hola! Soy Karu.
            Gracias por visitar a Gunter.

            ¿Quieres ayudarme a cuidarlo?

        </div>

        <button id="dato-btn">
            Dato curioso
        </button>

    </aside>

</main>

<footer>

    EVARKION © Gunter's World

</footer>

</body>
</html>
