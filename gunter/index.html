
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0d0d0d">

    <meta name="description"
          content="Entra en Gunter's World, cuida de Gunter y descubre su pequeño universo junto a Karu.">

    <title>Gunter's World | EVARKION</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

<header>

    <h1>🐈 Gunter's World</h1>

    <p>
        Cuida de Gunter, juega con él y descubre curiosidades junto a Karu.
    </p>

</header>

<main>

    <!-- HABITACIÓN -->

    <section id="room" aria-label="Habitación de Gunter">

        <img
            id="gunter"
            src="assets/characters/gunter_idle.png"
            alt="Gunter descansando en su habitación"
        >

        <div class="objeto caja" aria-label="Caja">📦</div>

        <div class="objeto ovillo" aria-label="Ovillo">🧶</div>

        <div class="objeto comida" aria-label="Comida">🥣</div>

        <div class="objeto agua" aria-label="Agua">💧</div>

        <div class="objeto saco" aria-label="Saco">👜</div>

    </section>

    <!-- PANEL KARU -->

    <aside id="karu-panel" aria-label="Asistente Karu">

        <div class="karu-top">

            <img
                src="assets/characters/karu_avatar.png"
                alt="Avatar de Karu"
                id="karu-avatar"
            >

            <h2>Karu</h2>

        </div>

        <div id="karu-text" aria-live="polite">

            ¡Hola! Soy Karu.
            Gracias por visitar a Gunter.

            ¿Quieres ayudarme a cuidarlo?

        </div>

        <button id="dato-btn" type="button">
            Dato curioso
        </button>

    </aside>

</main>

<footer>

    EVARKION © Gunter's World

</footer>

</body>

</html>
